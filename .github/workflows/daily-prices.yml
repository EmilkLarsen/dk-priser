name: daily-prices

on:
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC = 04:00 DK, after nightly sitemap regen
  workflow_dispatch:
    inputs:
      full:
        description: "Full scrape (default: smoke 30/chain)"
        required: false
        default: "false"
      limit:
        description: "Products per chain (smoke mode)"
        required: false
        default: "30"
      resume:
        description: "Resume mode: append to existing snapshots (for timeout continuation)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: daily-prices
  cancel-in-progress: false   # never kill a running catalog build

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        chain: [silvan, xlbyg, stark, bauhaus, davidsen,
                fog, haraldnyborg, power, skousen]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scraper (${{ matrix.chain }})
        env:
          RESUME: ${{ inputs.resume == 'true' && '1' || '0' }}
        run: |
          if [ "${{ inputs.full }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            python scraper/run_daily.py --only ${{ matrix.chain }}
          else
            python scraper/run_daily.py --only ${{ matrix.chain }} ${{ inputs.limit || '30' }}
          fi

      - name: Commit snapshot
        run: |
          git config user.name "price-bot"
          git config user.email "bot@noreply.github.com"
          git add data/latest/${{ matrix.chain }}.jsonl data/latest/summary-${{ matrix.chain }}.json data/history || true
          git diff --cached --quiet && echo "No changes" || git commit -m "prices: ${{ matrix.chain }} $(date -u +%F)"
          # push with retry: concurrent chain jobs rebase against each other
          for i in 1 2 3 4 5 6 7 8; do
            git pull --rebase --autostash origin main && git push && break
            echo "push conflict, retry $i"; sleep $((i * 10))
          done

  merge:
    needs: scrape
    if: always()   # merge whatever succeeded — partial catalog beats none
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Merge + comparison
        run: |
          python scraper/merge_all.py
          # prune history older than 120 days (repo stays small forever)
          find data/history -name "*.jsonl" -mtime +120 -delete || true

      - name: Commit merged feed
        run: |
          git config user.name "price-bot"
          git config user.email "bot@noreply.github.com"
          git add data/latest/prices.jsonl data/latest/comparison.json data/latest/summary.json data/latest/ages.json data/latest/index.html data/latest/schema.json || true
          git diff --cached --quiet && echo "No changes" || git commit -m "merged feed $(date -u +%F)"
          for i in 1 2 3 4 5 6 7 8; do
            git pull --rebase --autostash origin main && git push && break
            echo "push conflict, retry $i"; sleep $((i * 10))
          done

  continue-check:
    needs: [scrape, merge]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Detect incomplete chains
        id: check
        run: |
          python scraper/check_incomplete.py || true
          INC=$(python scraper/check_incomplete.py 2>/dev/null | sed -n 's/^incomplete: //p')
          echo "incomplete=$INC" >> $GITHUB_OUTPUT
      - name: Re-dispatch resume run for incomplete chains
        if: steps.check.outputs.incomplete != '' && steps.check.outputs.incomplete != '(none)'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # avoid infinite loops: max 4 continuation attempts per day
          ATTEMPT=$(ls data/latest/.continue-attempt-* 2>/dev/null | wc -l || echo 0)
          if [ "$ATTEMPT" -ge 4 ]; then
            echo "Max continuation attempts reached — will retry tomorrow"; exit 0
          fi
          touch "data/latest/.continue-attempt-$((ATTEMPT + 1))"
          git config user.name price-bot; git config user.email bot@noreply.github.com
          git add data/latest/.continue-attempt-* data/latest/completion.json
          git commit -m "continue attempt $((ATTEMPT + 1))" || true
          git pull --rebase --autostash origin main && git push || true
          gh workflow run daily-prices.yml -f full=true -f resume=true

  alert:
    needs: [scrape, merge]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Open failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Nightly price run failed ${new Date().toISOString().slice(0,10)}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', per_page: 100
            });
            const dup = existing.data.find(i => i.title === title);
            const body = 'One or more chain jobs or the merge job failed. Check the run: ' + context.runUrl;
            if (dup) {
              await github.rest.issues.createComment({ owner: context.repo.owner,
                repo: context.repo.repo, issue_number: dup.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner,
                repo: context.repo.repo, title, body });
            }
