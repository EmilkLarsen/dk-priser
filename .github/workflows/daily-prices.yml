name: daily-prices

on:
  schedule:
    # 02:17, not 02:00 - GitHub's own docs warn that top-of-the-hour cron
    # triggers queue behind everyone else's, and it showed: confirmed live,
    # every "02:00" run actually started 06:47-07:30 UTC, a ~5h delay that
    # ate deep into the very time budget these chains need. A few minutes
    # off the hour costs nothing and avoids that queue entirely.
    - cron: "17 2 * * *"   # ~02:17 UTC = ~04:17 DK, after nightly sitemap regen
  workflow_dispatch:
    inputs:
      full:
        description: "Full scrape (default: smoke 30/chain)"
        required: false
        default: "false"
      limit:
        description: "Products per chain (smoke mode)"
        required: false
        default: "30"
      resume:
        description: "Resume mode: append to existing snapshots (for timeout continuation)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: daily-prices
  cancel-in-progress: false   # never kill a running catalog build

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        chain: [silvan, xlbyg, stark, bauhaus, davidsen,
                fog, haraldnyborg, power, skousen]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scraper (${{ matrix.chain }})
        env:
          RESUME: ${{ inputs.resume == 'true' && '1' || '0' }}
          SCRAPE_BUDGET: "270"   # stop cleanly after 4.5h, commit offset, continue next run - scrape_urls chains (bauhaus/davidsen/fog/haraldnyborg/power/skousen)
          # 300 min soft cutoff inside this job's 350-min hard timeout above -
          # the 50-min gap is what lets a checkpointed chain (silvan/xlbyg/
          # stark) exit on its own and reach "Commit snapshot" instead of
          # being SIGKILLed mid-request with nothing durably saved. Separate
          # from SCRAPE_BUDGET above because these three chains go through
          # scrape_with_checkpoint, not scrape_urls - see that function's own
          # doc comment for why an externally killed job previously meant
          # zero progress, forever, even after SCRAPE_BUDGET shipped for the
          # other six chains.
          SCRAPE_DEADLINE_SECONDS: "18000"
        run: |
          if [ "${{ inputs.full }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            python scraper/run_daily.py --only ${{ matrix.chain }}
          else
            python scraper/run_daily.py --only ${{ matrix.chain }} ${{ inputs.limit || '30' }}
          fi

      - name: Commit snapshot
        run: |
          git config user.name "price-bot"
          git config user.email "bot@noreply.github.com"
          git add data/latest/${{ matrix.chain }}.jsonl data/latest/summary-${{ matrix.chain }}.json data/history || true
          # Checkpoint/seen-set files (only silvan/xlbyg/stark produce these -
          # see scrape_with_checkpoint) committed separately: without this,
          # every fresh job checkout starts that resume logic from a
          # permanently empty seen-set, since nothing on the runner's own
          # disk survives past this job - confirmed live, these three chains
          # never made net progress across dozens of runs despite the
          # checkpoint code appearing to work correctly within a single run.
          git add data/latest/.checkpoint-${{ matrix.chain }}.jsonl data/latest/.seen-${{ matrix.chain }}.txt 2>/dev/null || true
          # stark's rotation-day marker (data/latest/.stark-rotation-day, see
          # rotate_slice/stark.py) is its OWN separate `git add` - its
          # existence is independent of the checkpoint pair above (it
          # outlives a completed rotation slice, which deletes ITS OWN
          # checkpoint files but never touches this marker), and `git add`
          # aborts the ENTIRE command - staging NOTHING, not even paths that
          # DO exist - the moment any one listed path doesn't match
          # (confirmed locally). Mixed into the line above, a completed
          # slice (marker present, checkpoint pair absent) would silently
          # fail to commit the marker at all - the same class of "resume
          # state never actually persists" bug already found and fixed once
          # for the checkpoint files themselves.
          git add data/latest/.stark-rotation-day 2>/dev/null || true
          git diff --cached --quiet && echo "No changes" || git commit -m "prices: ${{ matrix.chain }} $(date -u +%F)"
          # push with retry: concurrent chain jobs rebase against each other.
          # A real conflict (not just a fast-forward race) leaves the rebase
          # itself mid-conflict - confirmed live: every one of these 8
          # retries then fails identically with "Pulling is not possible
          # because you have unmerged files", the loop exhausts silently,
          # and the step still exits 0 (its last command was a plain echo),
          # so a genuinely lost push looked like success. `rebase --abort`
          # before each retry gives it a real chance to succeed against
          # whatever's on origin by then; failing loudly if all 8 still
          # don't land means a stuck push shows up as a failed job instead
          # of vanishing.
          pushed=false
          for i in 1 2 3 4 5 6 7 8; do
            if git pull --rebase --autostash origin main && git push; then
              pushed=true; break
            fi
            git rebase --abort 2>/dev/null || true
            echo "push conflict, retry $i"; sleep $((i * 10))
          done
          if [ "$pushed" != true ]; then
            echo "::error::failed to push ${{ matrix.chain }}'s snapshot after 8 retries - scraped data was NOT committed"
            exit 1
          fi

  merge:
    needs: scrape
    if: always()   # merge whatever succeeded — partial catalog beats none
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Merge, commit, and push
        run: |
          git config user.name "price-bot"
          git config user.email "bot@noreply.github.com"
          # Every file this job produces is 100% derived from the per-chain
          # data/latest/<chain>.jsonl files already in the checkout (see
          # merge_all.py's own header) - nothing here is hand-authored, so
          # there is never a reason to fight to preserve one frozen local
          # snapshot of them over a fresher one. Confirmed live: this exact
          # push previously got stuck in a real rebase conflict (a near-
          # empty "merge" from an earlier CANCELLED dispatch's own
          # `if: always()` merge job landed on main first, then this run's
          # real, hours-later merge conflicted against it) and silently
          # lost an entire evening's feed. Rather than detect-and-recover
          # from that one shape of conflict, this regenerates from
          # whatever's actually on origin on every retry - reset onto the
          # latest main, rebuild, commit, plain-push; if someone else's
          # commit lands in that same window, there's nothing to reconcile,
          # just redo the cycle against the new tip. No rebase, so nothing
          # to get stuck mid-conflict on.
          pushed=false
          for i in 1 2 3 4 5 6 7 8; do
            git fetch origin main -q
            git reset --hard origin/main -q
            python scraper/merge_all.py
            # Small BOM-matchable catalog the Fixer app fetches at runtime.
            python scraper/build_estimator_catalog.py
            # prune history older than 120 days (repo stays small forever)
            find data/history -name "*.jsonl" -mtime +120 -delete || true
            # Commit the gzipped feed, not the raw one - confirmed live,
            # prices.jsonl reached 59MB (past GitHub's 50MB warning, closing
            # in on its 100MB hard block) and only grows as silvan/xlbyg/
            # stark catch up. Gzip -9 on this file measured 59MB -> 9.1MB
            # (verified byte-identical round trip locally before this
            # shipped), and sync-dk-priser now fetches+decompresses the
            # .gz directly (falls back to the plain file if it's ever
            # missing) - nothing downstream loses any data, this only
            # changes the bytes at rest in git.
            gzip -kf9 data/latest/prices.jsonl
            git rm --cached --ignore-unmatch -q data/latest/prices.jsonl
            rm -f data/latest/prices.jsonl
            git add data/latest/prices.jsonl.gz data/latest/comparison.json data/latest/summary.json data/latest/ages.json data/latest/index.html data/latest/schema.json data/latest/estimator_catalog.json || true
            if git diff --cached --quiet; then
              echo "No changes"; pushed=true; break
            fi
            git commit -q -m "merged feed $(date -u +%F)"
            if git push origin main; then
              pushed=true; break
            fi
            echo "push race, retry $i - origin moved, regenerating against its new tip"
            sleep $((i * 10))
          done
          if [ "$pushed" != true ]; then
            echo "::error::failed to push the merged feed after 8 retries - prices.jsonl was NOT updated"
            exit 1
          fi

  continue-check:
    needs: [scrape, merge]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Detect incomplete chains
        id: check
        run: |
          python scraper/check_incomplete.py || true
          INC=$(python scraper/check_incomplete.py 2>/dev/null | sed -n 's/^incomplete: //p')
          echo "incomplete=$INC" >> $GITHUB_OUTPUT
      - name: Re-dispatch resume run for incomplete chains
        if: steps.check.outputs.incomplete != '' && steps.check.outputs.incomplete != '(none)'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # avoid infinite loops: max 4 continuation attempts PER DAY. The
          # markers are date-stamped and old ones cleaned up here - without
          # that, they just accumulate in the repo forever (confirmed live:
          # all 4 from a single day were still sitting there weeks later),
          # so `ls .continue-attempt-*` counts every attempt ever made, not
          # today's, and permanently pins this at "max reached" the moment
          # any 4 attempts have ever happened - silently disabling
          # auto-continue for good instead of just for the rest of that day.
          #
          # Same fetch/reset/regenerate/push pattern as the merge job (see
          # its own comment) instead of a bare `|| true` rebase attempt -
          # the marker files and completion.json are just as fully
          # regenerable, and a silently-lost attempt marker here means the
          # 4-per-day counter under- or over-counts real attempts, which
          # either wastes redispatches or wrongly blocks them for the rest
          # of the day.
          git config user.name price-bot; git config user.email bot@noreply.github.com
          for i in 1 2 3; do
            git fetch origin main -q
            git reset --hard origin/main -q
            python scraper/check_incomplete.py || true
            TODAY=$(date -u +%F)
            find data/latest -maxdepth 1 -name '.continue-attempt-*' -not -name ".continue-attempt-${TODAY}-*" -delete
            ATTEMPT=$(ls data/latest/.continue-attempt-${TODAY}-* 2>/dev/null | wc -l || echo 0)
            if [ "$ATTEMPT" -ge 4 ]; then
              echo "Max continuation attempts reached for today — will retry tomorrow"; exit 0
            fi
            touch "data/latest/.continue-attempt-${TODAY}-$((ATTEMPT + 1))"
            git add -A data/latest/.continue-attempt-* data/latest/completion.json
            git commit -q -m "continue attempt $((ATTEMPT + 1)) ($TODAY)" || true
            if git push origin main; then break; fi
            echo "push race, retry $i"; sleep $((i * 5))
          done
          gh workflow run daily-prices.yml -f full=true -f resume=true

  alert:
    # continue-check added: it now does real git/bash work of its own (the
    # race-proof push loop above) that scrape/merge failing wouldn't catch -
    # a broken continue-check previously could never trip this alert at all,
    # since `contains(needs.*.result, ...)` only looks at jobs actually
    # listed here.
    needs: [scrape, merge, continue-check]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Open failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Nightly price run failed ${new Date().toISOString().slice(0,10)}`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', per_page: 100
            });
            const dup = existing.data.find(i => i.title === title);
            // `context.runUrl` isn't a real property on the script context
            // (Context only exposes serverUrl/repo/runId etc.) - this
            // always rendered as the literal string "undefined" in the
            // issue body, so the one thing the alert exists to give you
            // (a link to actually go look) never worked.
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = 'One or more chain jobs, the merge job, or continue-check failed. Check the run: ' + runUrl;
            if (dup) {
              await github.rest.issues.createComment({ owner: context.repo.owner,
                repo: context.repo.repo, issue_number: dup.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner,
                repo: context.repo.repo, title, body });
            }
